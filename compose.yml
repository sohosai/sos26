services:
  app:
    image: oven/bun:alpine
    working_dir: /repo
    command: sh -c "bun install && bun run db:migrate:dev && bun run dev --env-mode=loose"
    ports:
      - "5173:5173"
      - "3000:3000"
    # 開発用のデフォルト値。リポジトリ直下の .env（またはシェルの環境変数）で指定すればそちらが優先される
    environment:
      S3_FORCE_PATH_STYLE: "true"
      # --- API ---
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      # デフォルト値なし（リポジトリ直下の .env で指定する。未指定なら渡さない）
      SENDGRID_API_KEY:
      EMAIL_FROM:
      VAPID_PUBLIC_KEY:
      VAPID_PRIVATE_KEY:
      # Firebase: 本物のプロジェクトを使う場合は .env で FIREBASE_AUTH_EMULATOR_HOST= （空）を指定し、
      # FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY を設定する
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-sos26}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST-firebase-auth:9099}
      FIREBASE_CLIENT_EMAIL:
      FIREBASE_PRIVATE_KEY:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:password@db:5432/app}
      ADMIN_MAIL: ${ADMIN_MAIL:-admin@example.com}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-storage:9000}
      S3_REGION: ${S3_REGION:-jp-north-1}
      S3_BUCKET: ${S3_BUCKET:-localbucket}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dev_access_key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dev_secret_access_key}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-dev-file-token-secret-do-not-use-in-production}
      NOTIFICATION_SYNC_PASSWORD: ${NOTIFICATION_SYNC_PASSWORD:-dev-notification-sync-password}
      # --- Web ---
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-fake-api-key}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-localhost}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-demo-sos26}
      # 本物のプロジェクトを使う場合は .env で VITE_FIREBASE_AUTH_EMULATOR_URL= （空）を指定する
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL-http://localhost:9099}
      # 未指定なら API と同じ VAPID_PUBLIC_KEY を使う
      VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-${VAPID_PUBLIC_KEY:-}}
    volumes:
      - .:/repo
      - bun-cache:/root/.bun
      - node-modules:/repo/node_modules
    depends_on:
      db:
        condition: service_started
      object-storage:
        condition: service_started
      firebase-auth:
        condition: service_started
      # バケットが無ければ作成してから起動する
      create-bucket:
        condition: service_completed_successfully
  db:
    image: postgres:18.4-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql

  object-storage:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: jp-north-1
      RUSTFS_ACCESS_KEY: dev_access_key
      RUSTFS_SECRET_KEY: dev_secret_access_key
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Firebase Auth Emulator（http://localhost:4000 で管理UI）
  # プロジェクトIDを demo- で始めると、実際の Firebase プロジェクトには一切接続しない
  firebase-auth:
    image: node:24-alpine
    working_dir: /firebase
    command: >
      sh -c "apk add --no-cache openjdk21-jre-headless
      && exec npx -y firebase-tools@15.34.2 emulators:start
      --only auth --project demo-sos26
      --import=/firebase/store/data --export-on-exit=/firebase/store/data"
    ports:
      - "9099:9099"
      - "4000:4000"
    volumes:
      - ./firebase.json:/firebase/firebase.json:ro
      - firebase-data:/firebase/store
      - firebase-cache:/root/.cache

  create-bucket:
    image: amazon/aws-cli:latest
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dev_access_key
      AWS_SECRET_ACCESS_KEY: dev_secret_access_key
      AWS_DEFAULT_REGION: jp-north-1
    entrypoint: >
      /bin/sh -c " aws --endpoint-url http://object-storage:9000 s3 mb s3://localbucket || true "

volumes:
  postgres-data:
  object-storage-data:
  bun-cache:
  node-modules:
  firebase-data:
  firebase-cache:
